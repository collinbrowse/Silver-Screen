name: Awards catalog

on:
  schedule:
    # 10:00 UTC Monday. 4:00 AM America/Denver during daylight time, 3:00 AM in winter.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    name: Rebuild catalog
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Test builder
        run: python3 scripts/test_build_awards_catalog.py

      - name: Rebuild catalog
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: |
          python3 scripts/build_awards_catalog.py \
            --output SilverScreen/Data/Resources/AwardsCatalog.json \
            --summary-out /tmp/awards-summary.md

      - name: Open a pull request when credits change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- SilverScreen/Data/Resources/AwardsCatalog.json; then
            echo "Catalog unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B awards-catalog
          git add SilverScreen/Data/Resources/AwardsCatalog.json
          git commit -m "Update the awards catalog from Wikidata."
          # The checkout fetched main only, so there is no tracking ref for the
          # bot's branch. Lease against the remote tip read here instead. It is
          # empty on the first run, which means the branch must not exist yet.
          remote_sha="$(git ls-remote --heads origin refs/heads/awards-catalog | cut -f1)"
          git push --force-with-lease="refs/heads/awards-catalog:${remote_sha}" -u origin awards-catalog
          body="$(PYTHONPATH=scripts python3 -c 'import build_awards_catalog as builder, pathlib; print(builder.render_pr_body(pathlib.Path("/tmp/awards-summary.md").read_text()))')"
          if gh pr view awards-catalog --json url >/dev/null 2>&1; then
            gh pr edit awards-catalog --body "$body"
          else
            if ! gh pr create \
              --base main \
              --head awards-catalog \
              --title "Update awards catalog" \
              --body "$body"; then
              echo "::error::Pushed the awards-catalog branch but could not open its pull request. If gh says GitHub Actions is not permitted to create pull requests, open the PR by hand from awards-catalog, or turn on Settings > Actions > General > Allow GitHub Actions to create and approve pull requests."
              exit 1
            fi
          fi

