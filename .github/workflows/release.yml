name: Release

# Push a testflight/* tag after `release.py cut`. This job archives, uploads to
# TestFlight, syncs What to Test, and ships dSYMs to Sentry.
#
# A tag push runs the workflow file at the tagged commit, so a tag cut before a
# workflow fix keeps the old file. Re-run such a tag from Actions → Release →
# Run workflow on main, which uses main's workflow and checks out the tag.
# Leave "upload" off to archive and export only, which proves signing without
# shipping a build.

on:
  push:
    tags:
      - "testflight/*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to archive (testflight tag or SHA)"
        required: true
        type: string
      upload:
        description: "Upload to TestFlight (off archives and exports only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ship:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      NSUnbufferedIO: YES
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep iOS || true

      - name: Write secrets
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          # The deployed worker/ proxy, such as https://silverscreen-tmdb.<subdomain>.workers.dev/3.
          # A repository variable, not a secret: the URL ships in the app either way.
          TMDB_PROXY_URL: ${{ vars.TMDB_PROXY_URL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$SENTRY_DSN" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::error::Need repository secrets SENTRY_DSN, ASC_API_KEY_P8, ASC_KEY_ID, ASC_ISSUER_ID"
            exit 1
          fi
          # xcconfig treats // as a comment, so https:// would be cut to https:.
          # Write it as https:/$()/ like Secrets.example.xcconfig. Already-escaped
          # values have no // and pass through unchanged.
          dsn=$(printf '%s' "$SENTRY_DSN" | sed 's#//#/$()/#g')
          if [ -n "$TMDB_PROXY_URL" ]; then
            # The proxy adds the TMDB token, so the binary ships without one.
            proxy=$(printf '%s' "$TMDB_PROXY_URL" | sed 's#//#/$()/#g')
            tmdb_lines="TMDB_BASE_URL = ${proxy}"
          elif [ -n "$TMDB_ACCESS_TOKEN" ]; then
            echo "::warning::Repository variable TMDB_PROXY_URL is not set, so this build calls TMDB directly with the bundled token. See worker/README.md."
            tmdb_lines="TMDB_ACCESS_TOKEN = ${TMDB_ACCESS_TOKEN}"
          else
            echo "::error::Set repository variable TMDB_PROXY_URL (see worker/README.md) or repository secret TMDB_ACCESS_TOKEN"
            exit 1
          fi
          cat > Secrets.xcconfig <<EOF
          ${tmdb_lines}
          SENTRY_DSN = ${dsn}
          EOF
          # runner.temp is not available in a job-level env block, so the path
          # is set here and exported for archive, TestFlight notes, and dSYM upload.
          # altool finds the key by name, so it must be AuthKey_<key id>.p8.
          mkdir -p "$RUNNER_TEMP/private_keys"
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Without a certificate in the keychain, `-allowProvisioningUpdates` makes a
      # new "Apple Development: Created via API" certificate on every run, and the
      # team hits Apple's certificate limit. Import one reusable certificate into a
      # throwaway keychain instead. Export uses cloud-managed distribution signing.
      - name: Install development certificate
        env:
          DEV_CERT_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          DEV_CERT_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
        run: |
          if [ -z "$DEV_CERT_P12_BASE64" ]; then
            echo "::warning::DEV_CERT_P12_BASE64 is not set. Xcode will create a new development certificate for this run."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          p12="$RUNNER_TEMP/development.p12"
          printf '%s' "$DEV_CERT_P12_BASE64" | base64 --decode > "$p12"
          security import "$p12" -k "$keychain" -P "$DEV_CERT_PASSWORD" -f pkcs12 -A
          rm -f "$p12"
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Validate release files
        run: python3 scripts/release.py check

      # No unit tests here. `cut` commits to main, and CI already tested that
      # exact commit; repeating them added a simulator boot and several minutes.

      - name: Archive and upload
        run: |
          if [ "$UPLOAD" = "true" ]; then
            python3 scripts/release.py archive --upload
          else
            python3 scripts/release.py archive
          fi

      # Upload returns before App Store Connect registers the build, so poll.
      - name: TestFlight notes
        if: env.UPLOAD == 'true'
        run: python3 scripts/release.py tf-notes --wait 900
        continue-on-error: true

      # Sentry matches dSYMs to crashes by debug UUID, so no release name is
      # needed (and current sentry-cli rejects --release here).
      - name: Upload dSYMs to Sentry
        if: env.UPLOAD == 'true' && env.SENTRY_AUTH_TOKEN != ''
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          export PATH="$HOME/.local/bin:$PATH"
          sentry-cli debug-files upload \
            --org "$SENTRY_ORG" \
            --project "$SENTRY_PROJECT" \
            build/SilverScreen.xcarchive/dSYMs

      - name: Remove signing keychain
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"

      # Only on failure: on success the dSYMs are in Sentry and the build is in
      # App Store Connect, and uploading the archive costs a minute or more.
      - name: Upload archive artifact
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: silverscreen-xcarchive
          path: build/SilverScreen.xcarchive
          retention-days: 14
          if-no-files-found: ignore
