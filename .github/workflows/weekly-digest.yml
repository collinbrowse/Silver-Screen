name: Weekly digest

# Every Monday, post last week's downloads, rating, new reviews, crash-free
# rates, top issues, and feedback count as a `weekly-digest` issue. Sources
# without credentials or data (the App Store before launch) are skipped with a
# note. Secrets are listed in OBSERVABILITY.md.

on:
  schedule:
    # 15:00 UTC Monday. 9:00 AM America/Denver during daylight time, 8:00 AM in
    # winter. Late enough for Apple's weekly sales report to be published.
    - cron: "0 15 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  digest:
    name: Post digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Test digest
        run: |
          python3 scripts/test_weekly_digest.py
          python3 scripts/test_asc_api.py

      - name: Write App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_API_KEY_P8" ]; then
            echo "::notice::No App Store Connect key; the digest skips App Store sections."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          key_path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s\n' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Post digest
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_VENDOR_NUMBER: ${{ secrets.ASC_VENDOR_NUMBER }}
          # A read-only token, separate from the release job's dSYM upload token.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_READ_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/weekly_digest.py
