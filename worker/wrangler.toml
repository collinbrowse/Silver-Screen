# Cloudflare Worker that proxies TMDB for Silver Screen. Deploy steps: README.md.
name = "silverscreen-tmdb"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# The token is a secret, never a [vars] entry:
#   npx wrangler secret put TMDB_ACCESS_TOKEN

# Per-IP limit. Each app screen makes a few TMDB calls; images do not come here.
# period must be 10 or 60 seconds. namespace_id is any positive integer unique
# to this account.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 240
  period = 60

# Feature survey writes (POST /survey). A person submits once and maybe edits
# their answers, so a low limit only stops scripted floods.
[[ratelimits]]
name = "SURVEY_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60

# Feature survey storage (POST /survey). Without this block the route returns 503
# and the TMDB proxy works as before. A schema change is a new file in migrations/,
# applied with `wrangler d1 migrations apply silverscreen-survey --remote`
# (README.md → Feature survey).
[[d1_databases]]
binding = "SURVEY_DB"
database_name = "silverscreen-survey"
database_id = "ce5d0715-87b4-459c-9466-5c1c0e7427d2"
migrations_dir = "migrations"
